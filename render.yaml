services:
  - type: web
    name: floatchat-backend
    runtime: python
    region: oregon  # Change to your preferred Render region
    plan: free      # Change to 'starter' or higher for production

    # Working directory is the repo root
    buildCommand: pip install -r backend/requirements.txt

    # Render provides $PORT automatically — must bind to 0.0.0.0
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      # -------------------------------------------------------
      # Set all values marked <set-in-render-dashboard> in the
      # Render Environment Variables panel — never commit secrets.
      # -------------------------------------------------------

      # Secure key used for gov/elevated-access verification.
      # NEVER expose this in frontend code.
      - key: FLOWCHAT_SECURITY_KEY
        sync: false   # Means Render will prompt you to set it manually

      # Admin passkey for the security gate modal
      - key: SECURITY_LOG_PASSKEY
        sync: false

      # JWT signing secret
      - key: SECRET_KEY
        sync: false

      # CORS: comma-separated list of allowed frontend origins
      # Example: https://your-floatchat.netlify.app
      - key: CORS_ORIGINS
        sync: false

      # Groq AI API key (optional — for AI chat feature)
      - key: GROQ_API_KEY
        sync: false

      # Database URL — defaults to SQLite if not set.
      # For persistence on Render set this to a PostgreSQL URL.
      # Example: postgresql://user:pass@host/dbname
      - key: DATABASE_URL
        sync: false

      # Python environment
      - key: PYTHON_VERSION
        value: "3.11.0"
