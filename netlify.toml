[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    # Set VITE_API_URL in Netlify → Site → Environment Variables
    # Example value: https://floatchat-backend.onrender.com
    # Do NOT put FLOWCHAT_SECURITY_KEY or any backend secret here.
    NODE_VERSION = "20"

# SPA fallback — all routes serve index.html (works with hash-based routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
